name: px4sim
root: .
on_project_exit: tmux kill-window

windows:
  - GCS:
      layout: main-vertical
      panes:
        - main:
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 3
        - rosGcs:
            - sleep 5
            - ./container_run.sh
            - source /opt/ros/humble/setup.bash
            - sleep 20
            - cd /home/grvc/ros2_ws
            - ros2 run px4_ros_com ground_command.py
        - drone1:
            - sleep 5
            - ./container_run.sh
            - source /opt/ros/humble/setup.bash
            - sleep 15
            - cd /home/grvc/ros2_ws
            - ros2 run px4_ros_com offboard_control_status.py --ros-args -p namespace:=px4_1 -p MAV_SYS_ID:=1 -r __node:=offboard_1
        - drone2:
            - sleep 5
            - ./container_run.sh
            - source /opt/ros/humble/setup.bash
            - sleep 15
            - cd /home/grvc/ros2_ws
            - ros2 run px4_ros_com offboard_control_status.py --ros-args -p namespace:=px4_2 -p MAV_SYS_ID:=2 -r __node:=offboard_2
        - drone3:
            - sleep 5
            - ./container_run.sh
            - source /opt/ros/humble/setup.bash
            - sleep 15
            - cd /home/grvc/ros2_ws
            - ros2 run px4_ros_com offboard_control_status.py --ros-args -p namespace:=px4_3 -p MAV_SYS_ID:=3 -r __node:=offboard_3
  - Drones:
      layout: tiled
      panes:
        - gz:
            - sleep 3
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 3
            - gz sim -r Tools/simulation/gz/worlds/gazebo_world_temp.sdf
        - px4_1:
            - sleep 3
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - export PX4_HOME_LAT=37.426170
            - export PX4_HOME_LON=-6.003640
            - export PX4_HOME_ALT=9.0
            - sleep 3
            - PX4_SYS_AUTOSTART=4001 PX4_UXRCE_DDS_NS=px4_1 PX4_SIM_MODEL=gz_x500 PX4_HOME_LAT=37.426170 PX4_HOME_LON=-6.003640 PX4_HOME_ALT=9.0 ./build/px4_sitl_default/bin/px4 -i 1
        - px4_2:
            - sleep 3
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 7
            - PX4_GZ_STANDALONE=1 PX4_SYS_AUTOSTART=4001 PX4_GZ_MODEL_POSE="0,2" PX4_UXRCE_DDS_NS=px4_2 PX4_SIM_MODEL=gz_x500 ./build/px4_sitl_default/bin/px4 -i 2
        - px4_3:
            - sleep 3
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 7
            - PX4_GZ_STANDALONE=1 PX4_SYS_AUTOSTART=4001 PX4_GZ_MODEL_POSE="0,4" PX4_SIM_MODEL=gz_x500 PX4_UXRCE_DDS_NS=px4_3 ./build/px4_sitl_default/bin/px4 -i 3
  - Utils:
      layout: tiled
      panes:  
        - rostest:
            - sleep 5
            - ./container_run.sh
            - source /opt/ros/humble/setup.bash
            - sleep 8
            - ros2 launch rosbridge_server rosbridge_websocket_launch.xml
        - microDDS:
            - sleep 5
            - ./container_run.sh
            - sleep 2
            - MicroXRCEAgent udp4 -p 8888