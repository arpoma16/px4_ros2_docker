name: px4sim
root: .
on_project_start: devcontainerup || devcontainer up --workspace-folder ..
on_project_exit: docker stop dev_px4_ros2_cont_nvidia && tmux kill-session -t px4sim

windows:
  - GCS:
      layout: main-vertical
      panes:
        - gzserver:
            - cd ..
            - devcontainerhere
            - sleep 3
            - bash
            - source /opt/ros/humble/setup.bash
            - cd ~/ros2_ws && source install/setup.bash
            - ros2 launch muav_gcs_offboard uav_mock_swarm.launch.py
        - px4_2_offboard:
            - cd ..
            - devcontainerhere
            - sleep 15
            - bash
            - source /opt/ros/humble/setup.bash
            - cd ~/ros2_ws && source install/setup.bash
        - px4_3_offboard:
            - cd ..
            - devcontainerhere
            - sleep 15
            - bash
            - source /opt/ros/humble/setup.bash
            - cd ~/ros2_ws && source install/setup.bash
        - ros_gcs_bridge:
            - sleep 5
            - cd ..
            - devcontainerhere
            - sleep 8
            - cd /root/ros2_ws
            - ros2 launch rosbridge_server rosbridge_websocket_launch.xml call_services_in_new_thread:=True  send_action_goals_in_new_thread:=True default_call_service_timeout:=5.0
        - simulation_sftp_uav1:
            - sleep 5
            - docker run --rm -it --mount type=bind,source=/home/grvc/work/px4_ros2_docker/uav_media/uav_1,destination=/home/one/uav_media -p 4021:22 atmoz/sftp one:1234:::upload
