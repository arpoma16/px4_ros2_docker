name: px4sim
root: .
on_project_start: devcontainerup || devcontainer up --workspace-folder ..
on_project_exit: docker stop px4-devcontainer && tmux kill-window -t px4sim 

windows:
  - GCS:
      layout: main-vertical
      panes:
        - gzserver:
            - cd .. 
            - devcontainerhere
            - sleep 3
            - gz sim /root/PX4-gazebo-models/worlds/plazaAgua.sdf
        - gzgui:
            - sleep 15
            - export GZ_PARTITION=docker_sim_harmonic
            - export GZ_SIM_RESOURCE_PATH=$GZ_SIM_RESOURCE_PATH:$HOME/.simulation-gazebo/models
            - echo "gz sim -g -v 4 -r"
        - px4:
            - sleep 5
            - cd .. 
            - devcontainerhere
            - cd /root/PX4-Autopilot
            - sleep 3
            - PX4_UXRCE_DDS_NS=px4_3 PX4_SIM_MODEL=gz_x500_mono_cam ./build/px4_sitl_default/bin/px4 -i 2
        - ros_gz_bridge:
            - sleep 5
            - cd .. 
            - devcontainerhere
            - sleep 15
            - ros2 run ros_gz_bridge parameter_bridge /world/default/model/x500_mono_cam_2/link/camera_link/sensor/camera/image@sensor_msgs/msg/Image@gz.msgs.Image --ros-args --log-level debug
        - ros_gcs_bridge:
            - sleep 5
            - cd .. 
            - devcontainerhere
            - sleep 8
            - cd /root/ros2_ws
            - ros2 launch rosbridge_server rosbridge_websocket_launch.xml call_services_in_new_thread:=True  send_action_goals_in_new_thread:=True default_call_service_timeout:=5.0
        - rostest2:
            - sleep 5
            - cd .. 
            - devcontainerhere
            - sleep 8
            - cd /root/ros2_ws
            - colcon build
        - microDDS:
            - sleep 5
            - cd .. 
            - devcontainerhere
            - sleep 2
            - MicroXRCEAgent udp4 -p 8888
