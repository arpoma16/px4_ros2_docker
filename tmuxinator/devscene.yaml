name: px4sim
root: .
on_project_start: devcontainerup || devcontainer up --workspace-folder ..
on_project_exit: docker stop dev_px4_ros2_cont && tmux kill-window -t px4sim

windows:
  - GCS:
      layout: main-vertical
      panes:
        - gzserver:
            - cd ..
            - devcontainerhere
            - sleep 3
            - bash
            - source /opt/ros/humble/setup.bash
            - cd ~/ros2_ws && source install/setup.bash
            - ros2 launch muav_gcs_gz scene.launch.py
        - px4_2_offboard:
            - cd ..
            - devcontainerhere
            - sleep 15
            - bash
            - source /opt/ros/humble/setup.bash
            - cd ~/ros2_ws && source install/setup.bash
            - ros2 launch muav_gcs_offboard test.launch.py  mav_sys_id:=2 namespace:='px4_2'
        - px4_3_offboard:
            - cd ..
            - devcontainerhere
            - sleep 15
            - bash
            - source /opt/ros/humble/setup.bash
            - cd ~/ros2_ws && source install/setup.bash
            - ros2 launch muav_gcs_offboard test.launch.py  mav_sys_id:=3 namespace:='px4_3'
        - ros_gcs_bridge:
            - sleep 5
            - cd ..
            - devcontainerhere
            - sleep 8
            - cd /root/ros2_ws
            - ros2 launch rosbridge_server rosbridge_websocket_launch.xml call_services_in_new_thread:=True  send_action_goals_in_new_thread:=True default_call_service_timeout:=5.0

        - microDDS:
            - sleep 5
            - cd ..
            - devcontainerhere
            - sleep 2
            - MicroXRCEAgent udp4 -p 8888
