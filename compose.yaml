services:
  px4:
    image: ghcr.io/px4/px4-dev-ros2:latest
    container_name: px4_ros2
    restart: unless-stopped
    ports:
      - "11345:11345/udp"
      - "11346:11346/udp"
    environment:
      - PX4_SIMULATION=1
      - PX4_ROS2=1
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash && source /opt/px4_ros2/setup.bash && ros2 launch px4_ros2 px4.launch.py"]
  gazebo:
    image: osrf/ros:humble-desktop
    container_name: gazebo
    restart: unless-stopped
    ports:
      - "11345:11345/udp"
      - "11346:11346/udp"
    environment:
      - GAZEBO_MODEL_PATH=/usr/share/gazebo-11/models
    command: ["bash", "-c", "source /opt/ros/humble/setup.bash && ros2 launch gazebo_ros gazebo.launch.py"]
  microdds:
    image: ghcr.io/microdds/microdds:latest
    container_name: microdds
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - MICRODDS_PORT=8080
      - MICRODDS_HOST=