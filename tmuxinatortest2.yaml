name: px4sim
root: .
on_project_exit: tmux kill-window

windows:
  - GCS:
      layout: main-vertical
      panes:
        - main:
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 3
            - export GZ_SIM_RESOURCE_PATH=$GZ_SIM_RESOURCE_PATH:/root/.simulation-gazebo/models
            - #gz sim -r /root/.simulation-gazebo/worlds/gazebo_world_temp.sdf
            - python3 /home/grvc/PX4-Autopilot/Tools/simulation/gz/simulation-gazebo --world gazebo_world_temp 
        - px4:
            - sleep 5
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 3
            - export GZ_SIM_RESOURCE_PATH=$GZ_SIM_RESOURCE_PATH:/root/.simulation-gazebo/models
            - PX4_GZ_STANDALONE=1 PX4_SYS_AUTOSTART=4001 PX4_UXRCE_DDS_NS=px4_3 PX4_SIM_MODEL=gz_x500_mono_cam ./build/px4_sitl_default/bin/px4 -i 2
        - rostest:
            - sleep 5
            - ./container_run.sh
            - source /opt/ros/humble/setup.bash
            - sleep 8
            - export GZ_SIM_RESOURCE_PATH=$GZ_SIM_RESOURCE_PATH:/root/.simulation-gazebo/models
            - ros2 run ros_gz_bridge parameter_bridge /world/default/model/x500_mono_cam_2/link/camera_link/sensor/imager/image@sensor_msgs/msg/Image@gz.msgs.Image
        - rosGcs:
            - sleep 5
            - ./container_run.sh
            - source /opt/ros/humble/setup.bash
            - sleep 8
            - cd /home/grvc/ros2_ws
        - rostest2:
            - sleep 5
            - ./container_run.sh
            - source /opt/ros/humble/setup.bash
            - sleep 8
            - cd /home/grvc/ros2_ws
            - colcon build 
        - microDDS:
            - sleep 5
            - ./container_run.sh
            - sleep 2
            - MicroXRCEAgent udp4 -p 8888