name: px4sim
root: .
on_project_exit: tmux kill-window

windows:
  - GCS:
      layout: main-vertical
      panes:
        - main:
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 3
            - python3 /home/grvc/PX4-Autopilot/Tools/simulation/gz/simulation-gazebo --dryrun
            - gz sim -r /root/.simulation-gazebo/worlds/default.sdf
        - px4:
            - sleep 5
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 3
            - PX4_GZ_STANDALONE=1 PX4_SYS_AUTOSTART=4001 PX4_UXRCE_DDS_NS=px4_3 PX4_SIM_MODEL=gz_x500 ./build/px4_sitl_default/bin/px4 -i 2
        - ros_gcs_bridge:
            - sleep 5
            - ./container_run.sh
            - sleep 8
            - ros2 launch rosbridge_server rosbridge_websocket_launch.xml call_services_in_new_thread:=True  send_action_goals_in_new_thread:=True default_call_service_timeout:=5.0
        - ros_command:
            - sleep 5
            - ./container_run.sh
            - sleep 8
            - cd /home/grvc/ros2_ws
            - ros2 run px4_ros_com ground_command.py
        - ros_offboard:
            - sleep 5
            - ./container_run.sh
            - sleep 8
            - cd /home/grvc/ros2_ws
            - colcon build
            - ros2 launch px4_ros_com drone_real.launch.py
        - microDDS:
            - sleep 5
            - ./container_run.sh
            - sleep 2
            - MicroXRCEAgent udp4 -p 8888
