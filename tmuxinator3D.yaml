name: px4sim
root: .
on_project_exit: tmux kill-window

windows:
  - GCS:
      layout: tiled
      panes:
        - px4_1:
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 3
            - PX4_SYS_AUTOSTART=4001 PX4_SIM_MODEL=gz_x500 ./build/px4_sitl_default/bin/px4 -i 1
        - px4_2:
            - sleep 3
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 7
            - PX4_GZ_STANDALONE=1 PX4_SYS_AUTOSTART=4001 PX4_GZ_MODEL_POSE="0,2" PX4_SIM_MODEL=gz_x500 ./build/px4_sitl_default/bin/px4 -i 2
        - px4_3:
            - sleep 3
            - ./container_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 7   
            - PX4_GZ_STANDALONE=1 PX4_SYS_AUTOSTART=4001 PX4_GZ_MODEL_POSE="0,4" PX4_SIM_MODEL=gz_x500_gimbal ./build/px4_sitl_default/bin/px4 -i 3
        - microDDS:
            - sleep 10
            - ./container_run.sh
            - sleep 2
            - MicroXRCEAgent udp4 -p 8888
        - rostest:
            - sleep 15
            - ./container_run.sh
            - source /opt/ros/humble/setup.bash
            - sleep 8
            - ros2 topic list 
        - rostest2:
            - sleep 15
            - ./container_run.sh
            - source /opt/ros/humble/setup.bash
            - sleep 8
            - ros2 topic list 