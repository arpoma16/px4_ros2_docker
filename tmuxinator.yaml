name: px4sim
root: .
on_project_exit: tmux kill-window

windows:
  - GCS:
      layout: tiled
      panes:
        - px4:
            - ./containerWSL_run.sh
            - cd /home/grvc/PX4-Autopilot
            - sleep 3
            - PX4_SIM_MODEL=gz_x500 ./build/px4_sitl_default/bin/px4 -i 1
        - microDDS:
            - sleep 5
            - ./containerWSL_run.sh
            - sleep 2
            - MicroXRCEAgent udp4 -p 8888
        - frontend:
            - sleep 5
            - ./containerWSL_run.sh
            - source /opt/ros/humble/setup.bash
            - sleep 8
            - ros2 topic list 

